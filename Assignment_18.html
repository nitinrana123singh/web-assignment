<!DOCTYPE html>
<html lang="en"><head><title>Student Admission Page</title></head>
<body style="font-family:Arial;">
<header style="background-color:navy; color:white; text-align:center; padding:10px;"><h1>ABC College Admission 2026</h1></header>
<h2>Courses and Fees</h2>
<table border="1" cellpadding="8"><tr><th>Course</th><th>Seats</th><th>Fees</th></tr>
<tr><td>B.Tech</td><td>100</td><td>Rs. 90,000</td></tr><tr><td>BCA</td><td>50</td><td>Rs. 45,000</td></tr></table>
<h2>Admission Form</h2><form><fieldset><legend>Student Details</legend>
<label for="name">Name:</label><input type="text" id="name" required><br><br>
<label for="email">Email:</label><input type="email" id="email" required><br><br>
<label for="course">Course:</label><select id="course"><option>B.Tech</option><option>BCA</option></select><br><br>
<label for="reason">Why do you want to join?</label><br><textarea id="reason" rows="4" cols="30"></textarea><br><br>
<button type="submit">Apply Now</button></fieldset></form>
<footer style="background-color:navy; color:white; text-align:center; padding:10px;">Copyright 2026 ABC College</footer>
</body></html>
