<!DOCTYPE html>
<html><head><title>Form Validation</title></head><body>
<form action="submit.php" method="post">
Name: <input type="text" name="name" required><br><br>
Email: <input type="email" name="email" required><br><br>
Mobile: <input type="text" name="mobile" pattern="[0-9]{10}" title="Enter 10 digits" required><br><br>
Password: <input type="password" name="password" minlength="6" required><br><br>
Age: <input type="number" name="age" min="17" max="30" required><br><br>
<button type="submit">Register</button></form>
</body></html>
